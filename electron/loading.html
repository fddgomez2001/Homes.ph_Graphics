<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'unsafe-inline'; img-src 'self'" />
    <title>Daily Carousel Maker</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #ffffff;
        font-family: "Segoe UI", system-ui, sans-serif;
        color: #0f172a;
        -webkit-user-select: none;
        user-select: none;
        -webkit-app-region: drag;
      }
      main {
        height: 100%;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 14px;
        border: 1px solid #e2e8f0;
        box-sizing: border-box;
      }
      img {
        width: 88px;
        height: 88px;
      }
      h1 {
        margin: 0;
        font-size: 18px;
        font-weight: 600;
      }
      p {
        margin: 0;
        font-size: 13px;
        color: #64748b;
      }
      .bar {
        width: 160px;
        height: 4px;
        border-radius: 4px;
        background: #e2e8f0;
        overflow: hidden;
      }
      .bar span {
        display: block;
        width: 40%;
        height: 100%;
        border-radius: 4px;
        background: #0f4c81;
        animation: slide 1.1s ease-in-out infinite;
      }
      /* Follows the app's theme (dark by default). */
      @media (prefers-color-scheme: dark) {
        html,
        body {
          background: #0a0f1c;
          color: #e6ebf4;
        }
        main {
          border-color: #232d44;
        }
        p {
          color: #94a3b8;
        }
        .bar {
          background: #232d44;
        }
        .bar span {
          background: #7cb0fc;
        }
      }
      @keyframes slide {
        from {
          transform: translateX(-100%);
        }
        to {
          transform: translateX(250%);
        }
      }
    </style>
  </head>
  <body>
    <main>
      <img src="icon.png" alt="" />
      <h1>Daily Carousel Maker</h1>
      <p>Starting…</p>
      <div class="bar"><span></span></div>
    </main>
  </body>
</html>
